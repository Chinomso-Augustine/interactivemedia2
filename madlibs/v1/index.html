<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madlibs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer> </script>


</head>

<body>
    <main>
        <section id="heroBox">
            <img id="heroImage" src="Images/flower.JPG" alt="Flower">
            <h2>Madlib</h2>
        </section>

        <section id="formSection">
            <form id="myForm">
                <label for="noun1">Provide a noun </label>
                <input type="text" id="noun1">

                <label for="noun2">Provide a different noun </label>
                <input type="text" id="noun2">

                <label for="noun3">Provide a different noun</label>
                <input type="text" id="noun3">

                <label for="noun4">Provide a different noun</label>
                <input type="text" id="noun4">

                <label for="verb1">Provide a verb </label>
                <input type="text" id="verb1">

                <label for="verb2">Provide a different verb </label>
                <input type="text" id="verb2">

                <label for="verb3">Provide a different verb </label>
                <input type="text" id="verb3">

                <label for="verb4">Provide a different verb </label>
                <input type="text" id="verb4">

                <input type="submit" id="submitBtn" value="Send it">
            </form>

            <section id="madlibText">
                <p>Result will be here </p>
            </section>
        </section>

    </main>
</body>

</html>
