<body>

    <h1>Interns Page</h1>

    <h2>Welcome to our job portal. Please answer these questions to
        verify your qualification.
    </h2>

    <p id="description"> </p>



<script>

    var pTage = document.querySelector('#description');

    /*Function to verify if an intern qualify for a position
    Steps 1: Get the interns information including age
    Steps 2: Check if the intern is 18 or above, if not tell them they do not qualify
    step 3: Store the inputs in an array  and display them 

    */

    function interns() {
        //Array and getting info
        var userInfo = [];
        var name = prompt("What's your first and last name?");
        var age = parseInt(prompt("What's your age?"));

        //verifying age
        if (age < 18) {
            return `Hey ${name}, unfortunately you do not qualify due to your age. You must be 18 or above`;
        }

        //pushing info to the array 
        userInfo.push(name);
        userInfo.push(age);
        var country = userInfo.push(prompt("Where are you from?"));
        var school = userInfo.push(prompt("What school do you go to?"));
        var major = userInfo.push(prompt("What's your major?"));

        //Returning information
        return innerHTML = `Hey ${userInfo[0]}, we are happy you're visiting our page.
        You are ${userInfo[1]} years old and majoring in ${userInfo[4]}, which is great.
        Many of our employers are from ${userInfo[3]} and our job location includes ${userInfo[2]}.
        We will reach out soon.`;;
    }

    pTage.innerHTML = interns();

</script>

</body>
</html>
